<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgfit" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#161616"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A044FF"/>
      <stop offset="100%" stop-color="#7A25C8"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bgfit)"/>

  <!-- Dumbbell icon -->
  <g>
    <!-- left weight stack -->
    <rect x="6" y="24" width="9" height="16" rx="3" fill="url(#accent)"/>
    <rect x="16" y="19" width="9" height="26" rx="3" fill="url(#accent)"/>
    <!-- bar -->
    <rect x="25" y="26" width="14" height="12" rx="4" fill="url(#accent)"/>
    <!-- right weight stack -->
    <rect x="39" y="19" width="9" height="26" rx="3" fill="url(#accent)"/>
    <rect x="49" y="24" width="9" height="16" rx="3" fill="url(#accent)"/>
  </g>
</svg>