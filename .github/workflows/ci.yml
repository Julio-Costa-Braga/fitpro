name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma validate
        env:
          # O validate nao conecta ao banco; uma URL dummy satisfaz o env("DATABASE_URL") do schema.
          DATABASE_URL: postgresql://user:pass@localhost:5432/fitpro

      - run: npx prisma generate

      - run: npm run build
        env:
          # Necessario na fase de coleta de paginas; em producao o Vercel injeta o valor real.
          JWT_SECRET: ci-only-dummy-build-secret
          DATABASE_URL: postgresql://user:pass@localhost:5432/fitpro

      # Lint informativo: ha 85 erros pre-existentes no baseline que nao bloqueiam
      # o deploy; nao reprovar o build por isso.
      - run: npm run lint
        continue-on-error: true

      - run: npm test